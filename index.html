<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Learning Games</title>
<style>
:root { --bg: #F2F6FA; --surface: #FFFFFF; --fg: #1D1D1B; --muted: #55595F; --line: #C9D2DC; --accent: #1F5FA8; --wrong: #B3261E; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
form { width: 100%; max-width: 380px; background: var(--surface); border: 3px solid var(--line); border-radius: 24px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.lock { font-size: 3.4rem; line-height: 1; }
h1 { margin: 0; font-size: 1.6rem; }
label { font-weight: 700; font-size: 1.1rem; }
input[type=password] { font-size: 1.6rem; padding: 12px 14px; border: 3px solid var(--line); border-radius: 14px; text-align: center; width: 100%; }
input[type=password]:focus { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
button { font-size: 1.3rem; font-weight: 700; min-height: 56px; border-radius: 14px; border: none; background: var(--accent); color: #FFFFFF; cursor: pointer; }
button:disabled { opacity: .6; }
.remember { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 1rem; color: var(--muted); }
.remember input { width: 22px; height: 22px; }
#msg { min-height: 1.4em; font-weight: 700; color: var(--wrong); margin: 0; }
</style>
</head>
<body>
<main>
  <form id="f" autocomplete="off">
    <div class="lock" aria-hidden="true">🔒</div>
    <h1>Learning Games</h1>
    <label for="pw">Type the secret word</label>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="go" type="submit">Open</button>
    <label class="remember"><input id="rem" type="checkbox" checked> Remember on this device</label>
    <p id="msg" role="alert"></p>
  </form>
</main>

  var KEY_STORE = 'dlg-unlock-key';
  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function tob64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  var subtle = window.crypto && window.crypto.subtle;
  var msg = document.getElementById('msg');
  if (!subtle) { msg.textContent = 'This browser cannot open the games. Try Safari or Chrome.'; return; }

  function deriveKey(pw) {
    return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function unlock(key) {
    return subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.ct)).then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function open(key) { return unlock(key).then(show); }
  function saved() { try { return localStorage.getItem(KEY_STORE); } catch (e) { return null; } }

  var s = saved();
  if (s) {
    subtle.importKey('raw', b64(s), { name: 'AES-GCM' }, true, ['decrypt']).then(open).catch(function () {
      try { localStorage.removeItem(KEY_STORE); } catch (e) {}
    });
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value, go = document.getElementById('go');
    go.disabled = true; go.textContent = 'Opening…'; msg.textContent = '';
    var remember = document.getElementById('rem').checked, k;
    deriveKey(pw).then(function (key) { k = key; return unlock(key); }).then(function (html) {
      if (!remember) return show(html);
      return subtle.exportKey('raw', k).then(function (raw) {
        try { localStorage.setItem(KEY_STORE, tob64(raw)); } catch (e2) {}
        show(html);
      });
    }).catch(function () {
      go.disabled = false; go.textContent = 'Open';
